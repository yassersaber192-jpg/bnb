name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests
      - name: Build
        run: pyinstaller --noconfirm --onefile --windowed --name ETA-Tool --collect-data tzdata app.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/ETA-Tool.exe release/
          Copy-Item config.example.json release/
          Copy-Item README.md release/
          Compress-Archive -Path release/* -DestinationPath ETA-Tool.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ETA-Tool
          path: ETA-Tool.zip
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.2.${{ github.run_number }}"
          gh release create "$TAG" ETA-Tool.zip --title "ETA-Tool $TAG" --notes "نزّل ETA-Tool.zip، فك الضغط، وشغّل ETA-Tool.exe." --latest
